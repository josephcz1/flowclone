# FlowClone configuration. Edit and restart the daemon to apply.

[model]
# Weight precision for the speech model, trading resident RAM for accuracy.
# (Attention layers stay full precision so the live-preview stream keeps working.)
#   "8bit" (default) — ~896 MB, byte-for-byte identical output to full precision
#                      on the benchmark clip, and slightly faster.
#   "4bit"           — ~692 MB, same words with rare cosmetic punctuation drift.
#   "none"           — ~1280 MB, full bf16 precision.
# Re-benchmark your own audio with `uv run python scripts/bench_quant.py` before
# trusting a lower setting on vocabulary the sample clip doesn't cover.
quantization = "8bit"

[handsfree]
# Holding Right ⌘ is always push-to-talk. With this enabled, a QUICK TAP
# (< 0.35s) locks the mic on hands-free instead: finish by tapping again, or
# just stop talking — after silence_stop_seconds of quiet the dictation
# finalizes and pastes on its own. Tapping without speaking self-cancels.
enabled = true
silence_stop_seconds = 1.5

[cleanup]
# Master switch for the filler-strip and stutter-dedupe passes. The personal
# dictionary below still applies even when this is false.
enabled = true

# Collapse immediate word repeats: "the the API" -> "the API".
dedupe_stutters = true

# Read the text before your cursor (Accessibility) and join onto it properly:
# a leading space when one is missing, and lowercase when you paused mid-
# sentence. Costs ~1ms, taken while you are still speaking. Apps that refuse to
# expose their caret (WezTerm, Obsidian, Electron apps) simply get the old
# behavior. Diagnose any app with: uv run python scripts/ax_probe.py
context_aware = true

# Dictating just "scratch that" (or "delete that") deletes the previous
# dictation instead of pasting, provided nothing was typed or clicked since it
# landed. Strictly the whole utterance: "scratch that idea" pastes normally.
scratch_that = true

# Append a trailing space so back-to-back dictations don't run together. Largely
# superseded by context_aware, and unreliable anyway — Slack and some web fields
# strip a trailing space on paste.
add_trailing_space = false

# Softer fillers to remove on top of the safe built-in set (um, uh, er, hmm…).
# These CAN be meaningful words, so they're opt-in. Uncomment what you want gone:
extra_fillers = [
    # "like",
    # "you know",
    # "i mean",
    # "basically",
    # "actually",
    # "sort of",
    # "kind of",
]

# Built-in fillers you'd rather keep (e.g. "er" if you dictate British spellings).
keep = []

# Personal dictionary: words parakeet reliably mishears -> what you meant.
# Case-insensitive, whole-word; multi-word keys take priority over single words.
[dictionary]
"cloud" = "Claude"
"cloud code" = "Claude Code"
"wispr" = "Wispr"
"para keet" = "parakeet"
